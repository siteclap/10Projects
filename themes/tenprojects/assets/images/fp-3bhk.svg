<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none">
  <rect x="1" y="1" width="558" height="438" rx="4" stroke="#d1d5db" stroke-width="2" fill="#fafafa"/>
  <!-- Living + Dining -->
  <rect x="20" y="20" width="260" height="190" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f3f4f6"/>
  <text x="150" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#6b7280">Living &amp; Dining</text>
  <text x="150" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">18' × 14'</text>
  <!-- Master Bedroom -->
  <rect x="290" y="20" width="250" height="140" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="415" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Master Bedroom</text>
  <text x="415" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">14' × 12'</text>
  <!-- Master Bath -->
  <rect x="440" y="170" width="100" height="70" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="490" y="210" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">M.Bath</text>
  <!-- Bedroom 2 -->
  <rect x="290" y="170" width="140" height="120" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="360" y="225" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 2</text>
  <text x="360" y="245" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">12' × 10'</text>
  <!-- Bedroom 3 -->
  <rect x="290" y="300" width="250" height="120" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="415" y="355" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 3</text>
  <text x="415" y="375" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">12' × 10'</text>
  <!-- Kitchen -->
  <rect x="20" y="220" width="170" height="110" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#fefce8"/>
  <text x="105" y="275" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#a16207">Kitchen</text>
  <text x="105" y="295" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">10' × 8'</text>
  <!-- Bath 2 -->
  <rect x="200" y="220" width="80" height="110" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="240" y="275" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">Bath 2</text>
  <!-- Bath 3 -->
  <rect x="440" y="250" width="100" height="40" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="490" y="275" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">Bath 3</text>
  <!-- Balcony 1 -->
  <rect x="20" y="340" width="170" height="40" rx="2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 3" fill="#faf5ff"/>
  <text x="105" y="365" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Balcony</text>
  <!-- Balcony 2 -->
  <rect x="20" y="390" width="260" height="30" rx="2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 3" fill="#faf5ff"/>
  <text x="150" y="410" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Balcony</text>
  <!-- Label -->
  <text x="280" y="433" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#d1d5db">3 BHK — Indicative Layout</text>
</svg>
