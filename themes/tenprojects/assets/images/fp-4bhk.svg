<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none">
  <rect x="1" y="1" width="598" height="478" rx="4" stroke="#d1d5db" stroke-width="2" fill="#fafafa"/>
  <!-- Living + Dining -->
  <rect x="20" y="20" width="280" height="180" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f3f4f6"/>
  <text x="160" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#6b7280">Living &amp; Dining</text>
  <text x="160" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">20' × 14'</text>
  <!-- Master Bedroom -->
  <rect x="310" y="20" width="270" height="130" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="445" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Master Bedroom</text>
  <text x="445" y="98" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">16' × 14'</text>
  <!-- M.Bath -->
  <rect x="480" y="160" width="100" height="60" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="530" y="195" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">M.Bath</text>
  <!-- Bedroom 2 -->
  <rect x="310" y="160" width="160" height="110" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="390" y="210" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 2</text>
  <text x="390" y="230" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">12' × 10'</text>
  <!-- Bedroom 3 -->
  <rect x="20" y="210" width="200" height="130" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="120" y="270" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 3</text>
  <text x="120" y="290" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">12' × 10'</text>
  <!-- Bedroom 4 -->
  <rect x="20" y="350" width="200" height="110" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="120" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 4</text>
  <text x="120" y="420" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">11' × 10'</text>
  <!-- Kitchen -->
  <rect x="230" y="280" width="150" height="100" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#fefce8"/>
  <text x="305" y="330" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#a16207">Kitchen</text>
  <text x="305" y="350" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">12' × 9'</text>
  <!-- Bath 2 -->
  <rect x="230" y="210" width="70" height="60" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="265" y="245" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">Bath 2</text>
  <!-- Bath 3 -->
  <rect x="390" y="280" width="80" height="60" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="430" y="315" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">Bath 3</text>
  <!-- Bath 4 -->
  <rect x="230" y="390" width="80" height="70" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="270" y="430" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">Bath 4</text>
  <!-- Balcony -->
  <rect x="320" y="350" width="260" height="40" rx="2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 3" fill="#faf5ff"/>
  <text x="450" y="375" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Balcony</text>
  <!-- Balcony 2 -->
  <rect x="320" y="400" width="260" height="60" rx="2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 3" fill="#faf5ff"/>
  <text x="450" y="435" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Terrace</text>
  <!-- Label -->
  <text x="300" y="473" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#d1d5db">4 BHK — Indicative Layout</text>
</svg>
