  <text x="170" y="115" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">22' × 16'</text>
  <!-- Master Bedroom -->
  <rect x="330" y="20" width="290" height="120" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="475" y="73" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Master Bedroom</text>
  <text x="475" y="93" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">16' × 14'</text>
  <!-- M.Bath -->
  <rect x="520" y="150" width="100" height="55" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="570" y="183" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">M.Bath</text>
  <!-- Bedroom 2 -->
  <rect x="330" y="150" width="180" height="100" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="420" y="195" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 2</text>
  <text x="420" y="215" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">14' × 11'</text>
  <!-- Bedroom 3 -->
  <rect x="330" y="260" width="290" height="100" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="475" y="305" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 3</text>
  <text x="475" y="325" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">12' × 10'</text>
  <!-- Bedroom 4 -->
  <rect x="20" y="200" width="200" height="120" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="120" y="255" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 4</text>
  <text x="120" y="275" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">12' × 10'</text>
  <!-- Bedroom 5 -->
  <rect x="20" y="330" width="200" height="110" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#eff6ff"/>
  <text x="120" y="380" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Bedroom 5</text>
  <text x="120" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#9ca3af">11' × 10'</text>
  <!-- Kitchen -->
  <rect x="230" y="200" width="90" height="110" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#fefce8"/>
  <text x="275" y="255" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#a16207">Kitchen</text>
  <!-- Bath 2 -->
  <rect x="230" y="320" width="90" height="60" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="275" y="355" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">Bath 2</text>
  <!-- Bath 3 -->
  <rect x="520" y="215" width="100" height="35" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="570" y="238" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">Bath 3</text>
  <!-- Bath 4 -->
  <rect x="230" y="390" width="90" height="50" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f0fdf4"/>
  <text x="275" y="420" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#15803d">Bath 4</text>
  <!-- Balcony -->
  <rect x="330" y="370" width="290" height="35" rx="2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 3" fill="#faf5ff"/>
  <text x="475" y="393" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Balcony</text>
  <!-- Terrace -->
  <rect x="330" y="415" width="290" height="65" rx="2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 3" fill="#faf5ff"/>
  <text x="475" y="453" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#7c3aed">Terrace</text>
  <!-- Balcony 2 -->
  <rect x="20" y="450" width="200" height="30" rx="2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 3" fill="#faf5ff"/>
  <text x="120" y="470" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Balcony</text>
  <!-- Label -->
  <text x="320" y="513" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#d1d5db">5 BHK — Indicative Layout</text>
