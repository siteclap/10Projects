<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none">
  <rect x="1" y="1" width="638" height="518" rx="4" stroke="#d1d5db" stroke-width="2" fill="#fafafa"/>
  <!-- Living + Dining -->
  <rect x="20" y="20" width="300" height="170" rx="2" stroke="#9ca3af" stroke-width="1.5" fill="#f3f4f6"/>
