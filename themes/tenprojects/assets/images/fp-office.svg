<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" rx="12" fill="#F8FAFC"/>

  <!-- Grid lines -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="100" y1="80" x2="100" y2="520"/>
    <line x1="250" y1="80" x2="250" y2="520"/>
    <line x1="400" y1="80" x2="400" y2="520"/>
    <line x1="550" y1="80" x2="550" y2="520"/>
    <line x1="700" y1="80" x2="700" y2="520"/>
    <line x1="100" y1="180" x2="700" y2="180"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="420" x2="700" y2="420"/>
  </g>

  <!-- Outer walls -->
  <rect x="100" y="80" width="600" height="440" rx="4" stroke="#334155" stroke-width="3" fill="none"/>

  <!-- Reception area -->
  <rect x="100" y="80" width="200" height="140" fill="#DBEAFE" stroke="#334155" stroke-width="2"/>
  <text x="200" y="155" text-anchor="middle" fill="#1E40AF" font-family="Inter,sans-serif" font-size="14" font-weight="600">Reception</text>

  <!-- Conference room -->
  <rect x="300" y="80" width="200" height="140" fill="#FEF3C7" stroke="#334155" stroke-width="2"/>
  <!-- Conference table -->
  <rect x="350" y="120" width="100" height="60" rx="20" fill="#FDE68A" stroke="#92400E" stroke-width="1.5"/>
  <text x="400" y="155" text-anchor="middle" fill="#92400E" font-family="Inter,sans-serif" font-size="14" font-weight="600">Conference</text>

  <!-- Server/utility room -->
  <rect x="500" y="80" width="200" height="140" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="14" font-weight="600">Server Room</text>

  <!-- Open office area -->
  <rect x="100" y="220" width="450" height="200" fill="#F0FDF4" stroke="#334155" stroke-width="2"/>
  <!-- Desk rows -->
  <g fill="#D1FAE5" stroke="#059669" stroke-width="1">
    <rect x="130" y="250" width="60" height="30" rx="3"/>
    <rect x="200" y="250" width="60" height="30" rx="3"/>
    <rect x="270" y="250" width="60" height="30" rx="3"/>
    <rect x="340" y="250" width="60" height="30" rx="3"/>
    <rect x="410" y="250" width="60" height="30" rx="3"/>
    <rect x="130" y="300" width="60" height="30" rx="3"/>
    <rect x="200" y="300" width="60" height="30" rx="3"/>
    <rect x="270" y="300" width="60" height="30" rx="3"/>
    <rect x="340" y="300" width="60" height="30" rx="3"/>
    <rect x="410" y="300" width="60" height="30" rx="3"/>
    <rect x="130" y="350" width="60" height="30" rx="3"/>
    <rect x="200" y="350" width="60" height="30" rx="3"/>
    <rect x="270" y="350" width="60" height="30" rx="3"/>
    <rect x="340" y="350" width="60" height="30" rx="3"/>
    <rect x="410" y="350" width="60" height="30" rx="3"/>
  </g>
  <text x="300" y="410" text-anchor="middle" fill="#166534" font-family="Inter,sans-serif" font-size="14" font-weight="600">Open Office Area</text>

  <!-- Cabins -->
  <rect x="550" y="220" width="150" height="100" fill="#EDE9FE" stroke="#334155" stroke-width="2"/>
  <rect x="570" y="240" width="50" height="30" rx="3" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
  <rect x="630" y="240" width="50" height="30" rx="3" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="625" y="300" text-anchor="middle" fill="#6D28D9" font-family="Inter,sans-serif" font-size="13" font-weight="600">Cabins</text>

  <!-- Pantry -->
  <rect x="550" y="320" width="150" height="100" fill="#FFF7ED" stroke="#334155" stroke-width="2"/>
  <text x="625" y="375" text-anchor="middle" fill="#C2410C" font-family="Inter,sans-serif" font-size="14" font-weight="600">Pantry</text>

  <!-- Washrooms -->
  <rect x="100" y="420" width="150" height="100" fill="#F0F9FF" stroke="#334155" stroke-width="2"/>
  <text x="175" y="475" text-anchor="middle" fill="#0369A1" font-family="Inter,sans-serif" font-size="14" font-weight="600">Washrooms</text>

  <!-- Lobby/corridor -->
  <rect x="250" y="420" width="300" height="100" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
  <text x="400" y="475" text-anchor="middle" fill="#64748B" font-family="Inter,sans-serif" font-size="14" font-weight="600">Lobby &amp; Corridor</text>

  <!-- Entrance -->
  <rect x="550" y="420" width="150" height="100" fill="#ECFDF5" stroke="#334155" stroke-width="2"/>
  <path d="M600 500 L625 480 L650 500" stroke="#059669" stroke-width="2" fill="none"/>
  <text x="625" y="465" text-anchor="middle" fill="#059669" font-family="Inter,sans-serif" font-size="14" font-weight="600">Entrance</text>

  <!-- Title -->
  <text x="400" y="560" text-anchor="middle" fill="#94A3B8" font-family="Inter,sans-serif" font-size="13" font-weight="500">Commercial Unit Plan — Indicative Layout</text>
</svg>
